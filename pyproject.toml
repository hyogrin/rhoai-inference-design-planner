[project]
name = "rhoai-inference-design-planner"
version = "0.1.0"
description = "Evidence-backed inference design planning for Red Hat OpenShift AI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "sse-starlette>=2.1.0",
    "prometheus-client>=0.21.0",
    "mlflow>=2.16.0",
    "structlog>=24.4.0",
    "huggingface-hub>=0.25.0",
    "pyyaml>=6.0.0",
    "duckduckgo-search>=6.3.0",
    "mcp[cli]>=1.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
eval = [
    "anthropic>=0.34.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "datamodel-code-generator>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "backend", "connectors", "domain", "estimators", "mcp_servers", "templates"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: quick smoke tests that verify basic functionality",
    "db: tests that require a running PostgreSQL database",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
