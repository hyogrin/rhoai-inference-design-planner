namespace: inference-planner
domain: apps.ocp.wn7bz.sandbox786.opentlc.com

backend:
  replicas: 1
  image: quay.io/rh-ee-hyochoi/inference-planner-backend:latest
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicas: 1
  image: quay.io/rh-ee-hyochoi/inference-planner-frontend:latest
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  enabled: true
  image: postgres:15-alpine
  storage: 5Gi
  user: planner
  password: planner
  database: inference_planner
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

searxng:
  enabled: true
  image: searxng/searxng:latest
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

config:
  APP_ENV: production
  APP_LOG_LEVEL: INFO
  APP_CORS_ORIGINS: "https://inference-planner.apps.ocp.wn7bz.sandbox786.opentlc.com"
  LLM_MODEL: glm-53-flash
  VERIFY_SSL: "false"
  MLFLOW_TRACKING_URI: "https://rh-ai.apps.openshift-cluster.sandbox3031.opentlc.com/mlflow"
  MLFLOW_TRACKING_INSECURE_TLS: "true"
  MLFLOW_WORKSPACE: inference-planner
  MLFLOW_EXPERIMENT_NAME: inference-design-planner
  PROMETHEUS_ENABLED: "true"
  SEARXNG_URL: "http://localhost:8080"
  NEXT_PUBLIC_API_URL: ""   # e.g. https://inference-planner-api.apps.your-cluster.com
  NEXT_PUBLIC_AGENT_URL: "" # e.g. https://inference-planner-api.apps.your-cluster.com/agent

secret:
  LLM_API_KEY: sk-oai-1ThWxHclnScNcNXFc_71Z5mqjBeRTdqvIfqu83zvjgpJVRHjQdhCwajjw8tSR
  LLM_BASE_URL: "https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/glm-53-flash/v1"
  DATABASE_URL: "postgresql+asyncpg://planner:planner@postgresql:5432/inference_planner"
  DATABASE_URL_SYNC: "postgresql://planner:planner@postgresql:5432/inference_planner"
  MLFLOW_TRACKING_TOKEN: "sha256~O31jEAEXquvNwOhtvzh5vcuef2uvyFegwjjiFgONRZA"
