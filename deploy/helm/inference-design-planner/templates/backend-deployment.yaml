apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: inference-design-planner
      component: backend
  template:
    metadata:
      labels:
        app: inference-design-planner
        component: backend
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: planner-config
            - secretRef:
                name: planner-secrets
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: backend
spec:
  selector:
    app: inference-design-planner
    component: backend
  ports:
    - port: 8000
      targetPort: {{ .Values.backend.port }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: inference-planner-api
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: backend
spec:
  host: inference-planner-api.{{ .Values.domain }}
  to:
    kind: Service
    name: backend
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
