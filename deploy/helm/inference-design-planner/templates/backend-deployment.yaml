apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: inference-design-planner
      component: backend
  template:
    metadata:
      labels:
        app: inference-design-planner
        component: backend
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: planner-config
            - secretRef:
                name: planner-secrets
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
        {{- if .Values.searxng.enabled }}
        - name: searxng
          image: {{ .Values.searxng.image }}
          ports:
            - containerPort: {{ .Values.searxng.port }}
          env:
            - name: SEARXNG_BASE_URL
              value: "http://localhost:{{ .Values.searxng.port }}"
          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.searxng.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.searxng.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
        {{- end }}
      volumes:
        {{- if .Values.searxng.enabled }}
        - name: searxng-settings
          configMap:
            name: searxng-settings
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: backend
spec:
  selector:
    app: inference-design-planner
    component: backend
  ports:
    - port: 8000
      targetPort: {{ .Values.backend.port }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: inference-planner-api
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: backend
spec:
  host: inference-planner-api.{{ .Values.domain }}
  to:
    kind: Service
    name: backend
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
