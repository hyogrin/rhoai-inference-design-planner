apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: inference-design-planner
      component: frontend
  template:
    metadata:
      labels:
        app: inference-design-planner
        component: frontend
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: frontend
spec:
  selector:
    app: inference-design-planner
    component: frontend
  ports:
    - port: 3000
      targetPort: {{ .Values.frontend.port }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: inference-planner
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: frontend
spec:
  host: inference-planner.{{ .Values.domain }}
  to:
    kind: Service
    name: frontend
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
