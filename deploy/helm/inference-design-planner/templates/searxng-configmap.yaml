{{- if .Values.searxng.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-design-planner
    component: searxng
data:
  settings.yml: |
    use_default_settings: true
    server:
      bind_address: "0.0.0.0"
      port: {{ .Values.searxng.port }}
      secret_key: "inference-planner-searxng-key"
    search:
      safe_search: 0
      formats:
        - html
        - json
    engines:
      - name: duckduckgo
        engine: duckduckgo
        shortcut: ddg
        disabled: false
      - name: brave
        engine: brave
        shortcut: br
        disabled: false
      - name: wikipedia
        engine: wikipedia
        shortcut: wp
        disabled: false
      - name: arxiv
        engine: arxiv
        shortcut: arx
        disabled: false
{{- end }}
